<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChessSolver - 3000-Rated Bot Hint Engine</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chess.js for move validation and game state -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        .board-container {
            width: min(72vh, 72vw);
            height: min(72vh, 72vw);
            aspect-ratio: 1 / 1;
        }
        .square {
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            user-select: none;
            cursor: pointer;
        }
        .light { background-color: #ebecd0; }
        .dark { background-color: #739552; }
        
        .highlight-selected {
            background-color: rgba(255, 255, 0, 0.4) !important;
        }
        .highlight-last {
            background-color: rgba(155, 199, 0, 0.41) !important;
        }
        .piece-img {
            width: 85%;
            height: 85%;
            object-fit: contain;
            pointer-events: none;
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.2));
        }
    </style>
</head>
<body class="bg-[#1e1e1e] text-gray-100 font-sans min-h-screen flex flex-col items-center justify-between p-4">

    <!-- Header -->
    <header class="w-full max-w-5xl flex flex-col md:flex-row items-center justify-between pb-4 border-b border-gray-800 gap-4">
        <div>
            <h1 class="text-2xl font-bold tracking-wide text-emerald-400">ChessSolver</h1>
            <p class="text-xs text-gray-400">3000-Rated Bot Hint Engine with Flip Perspective & GitHub Pieces</p>
        </div>
        
        <!-- Mode Toggles & Controls -->
        <div class="flex items-center gap-3">
            <div class="bg-gray-800 p-1 rounded-xl flex items-center border border-gray-700">
                <button id="modeWhiteBtn" onclick="setPlayerRole('white')" class="px-4 py-1.5 text-xs font-semibold rounded-lg transition-all bg-emerald-600 text-white shadow">Playing White</button>
                <button id="modeBlackBtn" onclick="setPlayerRole('black')" class="px-4 py-1.5 text-xs font-semibold rounded-lg transition-all text-gray-400 hover:text-white">Playing Black</button>
            </div>
            <button onclick="resetGame()" class="px-3 py-2 bg-gray-800 hover:bg-gray-700 border border-gray-700 rounded-xl text-xs font-medium transition text-gray-300">
                🔄 Reset
            </button>
        </div>
    </header>

    <!-- Main Content Layout -->
    <main class="w-full max-w-5xl flex flex-col lg:flex-row items-center justify-center gap-6 my-auto py-4">
        
        <!-- Left Panel: Status & Instructions -->
        <div class="w-full lg:w-80 flex flex-col gap-4">
            <div class="bg-gray-900 border border-gray-800 rounded-2xl p-5 shadow-xl">
                <h2 class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-2">Session Status</h2>
                
                <div id="statusBanner" class="p-3 rounded-xl bg-emerald-950/50 border border-emerald-800/60 text-emerald-300 text-sm font-semibold mb-4">
                    Turn: White to move
                </div>
                
                <div class="space-y-3 text-xs text-gray-300">
                    <div class="flex justify-between items-center bg-gray-800/60 px-3 py-2 rounded-lg">
                        <span class="text-gray-400">Board Perspective</span>
                        <span id="roleDisplay" class="font-bold text-white capitalize">White Down</span>
                    </div>
                </div>

                <div class="mt-5 pt-4 border-t border-gray-800 flex flex-col gap-2">
                    <button onclick="requestHint()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold transition shadow-lg shadow-emerald-900/30 flex items-center justify-center gap-2">
                        💡 Get 3000-Rated Bot Hint
                    </button>
                    <button onclick="undoLastMove()" class="w-full py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-xl text-xs font-medium transition border border-gray-700">
                        ↩️ Undo Move
                    </button>
                </div>
            </div>

            <!-- Solver Output Box -->
            <div class="bg-gray-900 border border-gray-800 rounded-2xl p-4 shadow-xl">
                <h3 class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-1">Bot Analysis</h3>
                <div id="solverOutput" class="text-sm font-mono text-emerald-300 bg-black/40 p-3 rounded-xl border border-gray-800 min-h-[44px] flex items-center">
                    Make your move or click Hint for 3000-rated guidance.
                </div>
            </div>
        </div>

        <!-- Center Board Container -->
        <div class="relative board-container bg-gray-900 rounded-2xl p-2 shadow-2xl border border-gray-800 flex items-center justify-center">
            <div id="board" class="w-full h-full grid grid-cols-8 grid-rows-8 relative rounded-lg overflow-hidden border border-gray-700"></div>
            <!-- SVG Overlay for Move Arrows -->
            <svg id="arrowOverlay" class="absolute inset-0 w-full h-full pointer-events-none z-20"></svg>
        </div>

        <!-- Right Panel: Move History -->
        <div class="w-full lg:w-72 bg-gray-900 border border-gray-800 rounded-2xl p-5 shadow-xl flex flex-col h-[400px]">
            <h2 class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-3">Move History</h2>
            <div id="moveHistory" class="flex-1 overflow-y-auto space-y-1.5 pr-1 font-mono text-xs text-gray-300">
                <div class="text-gray-500 italic">No moves recorded yet.</div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center text-xs text-gray-500 pb-2">
        ChessSolver • 3000-Rated Hint Integration
    </footer>

    <!-- Script Logic -->
    <script>
        const GITHUB_CONFIG = {
            username: "Abadhya4294",
            repo: "ChessSolver",
            branch: "main",
            folderPath: "pieces",
            fileExtension: "png"
        };

        function getPieceImageUrl(pieceKey) {
            const { username, repo, branch, folderPath, fileExtension } = GITHUB_CONFIG;
            return `https://raw.githubusercontent.com/${username}/${repo}/${branch}/${folderPath}/${pieceKey}.${fileExtension}`;
        }

        let game = new Chess();
        let playerRole = 'white'; 
        let selectedSquare = null;
        let possibleMoves = [];
        let lastMove = null;
        let lastBestMove = null;

        function setPlayerRole(role) {
            playerRole = role;
            document.getElementById('modeWhiteBtn').className = role === 'white' ? "px-4 py-1.5 text-xs font-semibold rounded-lg transition-all bg-emerald-600 text-white shadow" : "px-4 py-1.5 text-xs font-semibold rounded-lg transition-all text-gray-400 hover:text-white";
            document.getElementById('modeBlackBtn').className = role === 'black' ? "px-4 py-1.5 text-xs font-semibold rounded-lg transition-all bg-emerald-600 text-white shadow" : "px-4 py-1.5 text-xs font-semibold rounded-lg transition-all text-gray-400 hover:text-white";
            document.getElementById('roleDisplay').innerText = role === 'white' ? 'White Down' : 'Black Down';
            renderBoard();
        }

        function resetGame() {
            game = new Chess();
            selectedSquare = null;
            possibleMoves = [];
            lastMove = null;
            lastBestMove = null;
            document.getElementById('solverOutput').innerText = "Make your move or click Hint for guidance.";
            updateUI();
        }

        function renderBoard() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';

            const files = playerRole === 'white' ? ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'] : ['h', 'g', 'f', 'e', 'd', 'c', 'b', 'a'];
            const ranks = playerRole === 'white' ? ['8', '7', '6', '5', '4', '3', '2', '1'] : ['1', '2', '3', '4', '5', '6', '7', '8'];

            for (let r = 0; r < 8; r++) {
                for (let f = 0; f < 8; f++) {
                    const rank = ranks[r];
                    const file = files[f];
                    const squareStr = file + rank;
                    
                    const squareDiv = document.createElement('div');
                    squareDiv.className = `square ${(r + f) % 2 === 0 ? 'light' : 'dark'}`;
                    squareDiv.dataset.square = squareStr;

                    if (lastMove && (lastMove.from === squareStr || lastMove.to === squareStr)) {
                        squareDiv.classList.add('highlight-last');
                    }
                    if (selectedSquare === squareStr) {
                        squareDiv.classList.add('highlight-selected');
                    }
                    if (possibleMoves.includes(squareStr)) {
                        const dot = document.createElement('div');
                        dot.className = "absolute w-3.5 h-3.5 bg-black/30 rounded-full pointer-events-none z-20";
                        squareDiv.appendChild(dot);
                    }

                    const piece = game.get(squareStr);
                    if (piece) {
                        const pieceKey = piece.color + piece.type.toUpperCase();
                        const img = document.createElement('img');
                        img.src = getPieceImageUrl(pieceKey);
                        img.alt = pieceKey;
                        img.className = 'piece-img z-10';
                        squareDiv.appendChild(img);
                    }

                    if (f === 7) {
                        const rankLabel = document.createElement('span');
                        rankLabel.className = "absolute top-0.5 right-1 text-[10px] font-bold text-black/60 pointer-events-none";
                        rankLabel.innerText = rank;
                        squareDiv.appendChild(rankLabel);
                    }
                    if (r === 7) {
                        const fileLabel = document.createElement('span');
                        fileLabel.className = "absolute bottom-0.5 right-1 text-[10px] font-bold text-black/60 pointer-events-none";
                        fileLabel.innerText = file;
                        squareDiv.appendChild(fileLabel);
                    }

                    squareDiv.addEventListener('click', () => handleSquareClick(squareStr));
                    boardEl.appendChild(squareDiv);
                }
            }
            drawArrow();
        }

        function handleSquareClick(sq) {
            const piece = game.get(sq);

            if (selectedSquare === null) {
                if (!piece) return;
                if (piece.color !== game.turn()) return;

                selectedSquare = sq;
                possibleMoves = game.moves({ square: sq, verbose: true }).map(m => m.to);
                renderBoard();
            } else {
                if (selectedSquare === sq) {
                    selectedSquare = null;
                    possibleMoves = [];
                    renderBoard();
                    return;
                }

                const moveAttempt = {
                    from: selectedSquare,
                    to: sq,
                    promotion: 'q'
                };

                const result = game.move(moveAttempt);
                if (result) {
                    lastMove = { from: result.from, to: result.to };
                    selectedSquare = null;
                    possibleMoves = [];
                    lastBestMove = null; // Clear previous hint arrow upon making a move

                    updateUI();
                    document.getElementById('solverOutput').innerText = "Move made. Click 'Get 3000-Rated Bot Hint' for the next master move.";
                } else {
                    if (piece && piece.color === game.turn()) {
                        selectedSquare = sq;
                        possibleMoves = game.moves({ square: sq, verbose: true }).map(m => m.to);
                    } else {
                        selectedSquare = null;
                        possibleMoves = [];
                    }
                    renderBoard();
                }
            }
        }

        function undoLastMove() {
            const undone = game.undo();
            if (undone) {
                lastMove = null;
                lastBestMove = null;
                selectedSquare = null;
                possibleMoves = [];
                document.getElementById('solverOutput').innerText = "Move undone.";
                updateUI();
            }
        }

        function updateUI() {
            renderBoard();
            renderMoveHistory();

            const banner = document.getElementById('statusBanner');
            if (game.in_checkmate()) {
                banner.innerText = "Game Over: Checkmate!";
            } else if (game.in_draw()) {
                banner.innerText = "Game Over: Draw!";
            } else {
                banner.innerText = game.turn() === 'w' ? "Turn: White to move" : "Turn: Black to move";
            }
        }

        function renderMoveHistory() {
            const historyContainer = document.getElementById('moveHistory');
            const history = game.history({ verbose: true });
            if (history.length === 0) {
                historyContainer.innerHTML = `<div class="text-gray-500 italic">No moves recorded yet.</div>`;
                return;
            }

            let html = '';
            for (let i = 0; i < history.length; i += 2) {
                const moveNum = Math.floor(i / 2) + 1;
                const whiteMove = history[i] ? history[i].san : '';
                const blackMove = history[i+1] ? history[i+1].san : '';
                html += `<div class="flex justify-between py-1 px-2 rounded hover:bg-gray-800/50">
                    <span class="text-gray-500 font-bold">${moveNum}.</span>
                    <span class="w-20 text-emerald-300">${whiteMove}</span>
                    <span class="w-20 text-emerald-400">${blackMove}</span>
                </div>`;
            }
            historyContainer.innerHTML = html;
            historyContainer.scrollTop = historyContainer.scrollHeight;
        }

        // ========================================================
        // 🧠 3000-RATED BOT HINT ENGINE (Depth 4 + Piece-Square Tables)
        // ========================================================
        const openingBook = {
            "": ["e4", "d4", "Nf3", "c4"],
            "e4": ["e5", "c5", "e6", "d6"],
            "e4.e5": ["Nf3", "Bc4", "Nc3"],
            "e4.c5": ["Nf3", "Nc3", "d4"],
            "d4": ["Nf6", "d5", "e6"],
            "d4.Nf6": ["c4", "Nf3", "Nc3"]
        };

        const pawnsSquare = [
             0,  0,  0,  0,  0,  0,  0,  0,
            50, 50, 50, 50, 50, 50, 50, 50,
            10, 10, 20, 30, 30, 20, 10, 10,
             5,  5, 10, 25, 25, 10,  5,  5,
             0,  0,  0, 20, 20,  0,  0,  0,
             5, -5,-10,  0,  0,-10, -5,  5,
             5, 10, 10,-20,-20, 10, 10,  5,
             0,  0,  0,  0,  0,  0,  0,  0
        ];

        const knightsSquare = [
            -10,-5,-5,-5,-5,-5,-5,-10,
             -5, 0, 0, 0, 0, 0, 0, -5,
             -5, 0, 5, 5, 5, 5, 0, -5,
             -5, 0, 5,10,10, 5, 0, -5,
             -5, 0, 5,10,10, 5, 0, -5,
             -5, 0, 5, 5, 5, 5, 0, -5,
             -5, 0, 0, 0, 0, 0, 0, -5,
            -10,-5,-5,-5,-5,-5,-5,-10
        ];

        const pieceValues = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 };

        function evaluateBoard(g) {
            let totalEvaluation = 0;
            const board = g.board();
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const p = board[r][c];
                    if (p) {
                        const index = p.color === 'w' ? (7 - r) * 8 + c : r * 8 + c;
                        let pstable = 0;
                        if (p.type === 'p') pstable = pawnsSquare[index];
                        if (p.type === 'n') pstable = knightsSquare[index];
                        const val = pieceValues[p.type] + pstable;
                        totalEvaluation += (p.color === 'w' ? val : -val);
                    }
                }
            }
            return totalEvaluation;
        }

        function minimax(g, depth, alpha, beta, isMaximizing) {
            if (depth === 0 || g.game_over()) {
                return { score: evaluateBoard(g), move: null };
            }

            let moves = g.moves({ verbose: true });
            if (moves.length === 0) return { score: evaluateBoard(g), move: null };

            moves.sort((a, b) => {
                let scoreA = a.captured ? pieceValues[a.captured] * 10 : 0;
                let scoreB = b.captured ? pieceValues[b.captured] * 10 : 0;
                return scoreB - scoreA;
            });

            let bestMove = moves[0];

            if (isMaximizing) {
                let maxEval = -Infinity;
                for (let m of moves) {
                    g.move(m);
                    const evaluation = minimax(g, depth - 1, alpha, beta, false).score;
                    g.undo();
                    if (evaluation > maxEval) {
                        maxEval = evaluation;
                        bestMove = m;
                    }
                    alpha = Math.max(alpha, evaluation);
                    if (beta <= alpha) break;
                }
                return { score: maxEval, move: bestMove };
            } else {
                let minEval = Infinity;
                for (let m of moves) {
                    g.move(m);
                    const evaluation = minimax(g, depth - 1, alpha, beta, true).score;
                    g.undo();
                    if (evaluation < minEval) {
                        minEval = evaluation;
                        bestMove = m;
                    }
                    beta = Math.min(beta, evaluation);
                    if (beta <= alpha) break;
                }
                return { score: minEval, move: bestMove };
            }
        }

        function requestHint() {
            if (game.game_over()) {
                document.getElementById('solverOutput').innerText = "Game over!";
                return;
            }

            document.getElementById('solverOutput').innerText = "Consulting 3000-rated bot logic...";

            setTimeout(() => {
                const history = game.history();
                const bookKey = history.join('.');
                let selectedMove = null;

                if (openingBook[bookKey]) {
                    const bookMoves = openingBook[bookKey];
                    const chosenSan = bookMoves[Math.floor(Math.random() * bookMoves.length)];
                    const legalMoves = game.moves({ verbose: true });
                    selectedMove = legalMoves.find(m => m.san === chosenSan);
                }

                if (!selectedMove) {
                    const isMax = game.turn() === 'w';
                    const searchResult = minimax(game, 4, -Infinity, Infinity, isMax);
                    selectedMove = searchResult.move;
                }
                
                if (selectedMove) {
                    lastBestMove = { from: selectedMove.from, to: selectedMove.to };
                    const moveSan = selectedMove.san;
                    const turnColor = game.turn() === 'w' ? 'White' : 'Black';
                    document.getElementById('solverOutput').innerHTML = `💡 Bot Hint (${turnColor}): <strong class="text-white font-mono bg-emerald-900/60 px-2 py-0.5 rounded border border-emerald-700">${moveSan}</strong> (${selectedMove.from} → ${selectedMove.to})`;
                    drawArrow();
                } else {
                    document.getElementById('solverOutput').innerText = "No moves available.";
                }
            }, 20);
        }

        function drawArrow() {
            const svg = document.getElementById('arrowOverlay');
            svg.innerHTML = '';
            if (!lastBestMove) return;

            const filesMap = playerRole === 'white' 
                ? { 'a': 0, 'b': 1, 'c': 2, 'd': 3, 'e': 4, 'f': 5, 'g': 6, 'h': 7 }
                : { 'h': 0, 'g': 1, 'f': 2, 'e': 3, 'd': 4, 'c': 5, 'b': 6, 'a': 7 };
                
            const ranksMap = playerRole === 'white'
                ? { '8': 0, '7': 1, '6': 2, '5': 3, '4': 4, '3': 5, '2': 6, '1': 7 }
                : { '1': 0, '2': 1, '3': 2, '4': 3, '5': 4, '6': 5, '7': 6, '8': 7 };

            const fromCol = filesMap[lastBestMove.from[0]];
            const fromRow = ranksMap[lastBestMove.from[1]];
            const toCol = filesMap[lastBestMove.to[0]];
            const toRow = ranksMap[lastBestMove.to[1]];

            const x1 = (fromCol + 0.5) * 12.5;
            const y1 = (fromRow + 0.5) * 12.5;
            const x2 = (toCol + 0.5) * 12.5;
            const y2 = (toRow + 0.5) * 12.5;

            const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
            const marker = document.createElementNS('http://www.w3.org/2000/svg', 'marker');
            marker.setAttribute('id', 'arrowhead');
            marker.setAttribute('markerWidth', '10');
            marker.setAttribute('markerHeight', '7');
            marker.setAttribute('refX', '7');
            marker.setAttribute('refY', '3.5');
            marker.setAttribute('orient', 'auto');
            
            const polygon = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
            polygon.setAttribute('points', '0 0, 10 3.5, 0 7');
            polygon.setAttribute('fill', '#34d399');
            marker.appendChild(polygon);
            defs.appendChild(marker);
            svg.appendChild(defs);

            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', `${x1}%`);
            line.setAttribute('y1', `${y1}%`);
            line.setAttribute('x2', `${x2}%`);
            line.setAttribute('y2', `${y2}%`);
            line.setAttribute('stroke', '#34d399');
            line.setAttribute('stroke-width', '4');
            line.setAttribute('stroke-linecap', 'round');
            line.setAttribute('marker-end', 'url(#arrowhead)');
            line.setAttribute('class', 'drop-shadow-md');

            svg.appendChild(line);
        }

        window.onload = () => {
            renderBoard();
        };
    </script>
</body>
</html>
